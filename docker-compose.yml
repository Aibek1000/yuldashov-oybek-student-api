name: yuldashov-oybek-student-api

services:
  app:
    image: yuldashov-oybek-student-api:v1.0-yuldashov-oybek
    build: .
    container_name: yuldashov-oybek-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yuldashov-net

  db:
    image: postgres:16
    container_name: yuldashov-oybek-db
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - yuldashov-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yuldashov-net

volumes:
  yuldashov-pgdata:

networks:
  yuldashov-net:
